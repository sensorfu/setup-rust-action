---
name: Setup Rust
description: Set up rust and rust-cache.
inputs:
  toolchain:
    description: Toolchain name.
    default: stable
    required: true
  profile:
    description: Rustup profile.
    default: minimal
    required: true
  components:
    description: Comma separated list of additional components.
    required: false
  force-non-host:
    description: Allow non-host toolchain to be installed.
    default: false
    required: false
  use-cache:
    description: Use rust-cache.
    default: true
    required: true
  cache-key:
    description: Additional cache key for rust-cache.
    required: false
  workspaces:
    description: Cargo workspaces for rust-cache.
    required: false

runs:
  using: composite
  steps:
    - name: Install Rust
      run: |
        set -- "$TOOLCHAIN" --profile "$PROFILE"
        if [[ -n "$COMPONENTS" ]]; then
          set -- "$@" --component "$COMPONENTS"
        fi
        if "$FORCE_NON_HOST"; then
          set -- "$@" --force-non-host
        fi
        set -x
        rustup toolchain install "$@" --no-self-update

        set +x
        set -- "$TOOLCHAIN"
        if "$FORCE_NON_HOST"; then
          set -- "$@" --force-non-host
        fi
        set -x
        rustup default "$@"
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        PROFILE: ${{ inputs.profile }}
        COMPONENTS: ${{ inputs.components }}
        FORCE_NON_HOST: ${{ case(inputs.force-non-host == 'true', 'true', 'false') }}
      shell: bash

    - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.workspaces }}
      if: inputs.use-cache == 'true'
