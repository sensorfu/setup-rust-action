---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        toolchain:
          - stable
          - beta
        use-cache:
          - true
          - false

    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          toolchain: ${{ matrix.toolchain }}
          use-cache: ${{ matrix.use-cache }}
          components: rustfmt
          workspaces: tests

      - run: cargo fmt --check
      - run: cargo check
      - run: cargo build --release

  test-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        toolchain:
          - stable-x86_64-pc-windows-msvc
          - stable-i686-pc-windows-msvc
        use-cache:
          - true
          - false

    defaults:
      run:
        working-directory: tests

    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          toolchain: ${{ matrix.toolchain }}
          force-non-host: true
          use-cache: ${{ matrix.use-cache }}
          components: rustfmt
          workspaces: tests

      - run: cargo fmt --check
      - run: cargo check
      - run: cargo build --release
